<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisa Mag - Resume</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!-- Navigation ... -->
    <nav class="navbar">
      <a href="/index.html" class="nav-logo">lisa<span>mag</span></a>

      <button class="hamburger" aria-label="Menu">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <ul class="nav-links">
        <li><a href="/index.html" class="link-work">work</a></li>
        <li><a href="/fun.html" class="link-fun">fun</a></li>
        <li><a href="/about.html" class="link-info">about</a></li>
        <li><a href="/contact.html" class="link-contact">contact</a></li>
        <li>
          <a href="/resume.html" class="link-resume">resume</a>
        </li>
      </ul>
    </nav>

    <div class="container resume-page">
      <h1 class="contact-title">Resume</h1>
      <p class="contact-subtitle">
        There you go :) grab the printable version if you need it on paper.
      </p>

      <div class="resume-preview">
        <object
          data="img/Lisa_Mag-Resume.pdf"
          type="application/pdf"
          title="Lisa Mag Resume preview"
          width="100%"
          height="100%"
        >
          <p class="resume-fallback">
            Your browser can't display the PDF inline.
            <a
              href="img/Lisa_Mag-Resume.pdf"
              target="_blank"
              rel="noopener noreferrer"
            >
              Open the resume directly </a
            >.
          </p>
        </object>
      </div>

      <div class="resume-cta">
        <a
          href="img/Lisa_Mag-Resume.pdf"
          class="button"
          target="_blank"
          rel="noopener"
        >
          <span class="circle"></span>
          <span>View full screen</span>
        </a>
        <a href="img/Lisa_Mag-Resume-print.pdf" class="button" download>
          <span class="circle"></span>
          <span>Printable version (B&amp;W)</span>
        </a>
      </div>
    </div>
  </body>
</html>
